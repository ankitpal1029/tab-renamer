<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #333;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 12px;
    }

    .instructions {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .instructions h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #495057;
    }

    .instructions ul {
      margin: 0;
      padding-left: 20px;
      color: #6c757d;
    }

    .instructions li {
      margin-bottom: 4px;
    }

    .current-tab {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .current-tab h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #495057;
    }

    .tab-title {
      font-weight: 500;
      color: #212529;
      word-break: break-word;
    }

    .rename-btn {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .rename-btn:hover {
      background: #0056b3;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
      color: #6c757d;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tab Renamer</h1>
    <p>Customize your tab titles</p>
  </div>

  <div class="instructions">
    <h3>How to use:</h3>
    <ul>
      <li>Right-click on any webpage</li>
      <li>Select "Rename Tab"</li>
      <li>Enter your custom title</li>
      <li>Click "Rename" or press Enter</li>
    </ul>
  </div>

  <div class="current-tab">
    <h3>Current Tab:</h3>
    <div class="tab-title" id="current-tab-title">Loading...</div>
  </div>

  <button class="rename-btn" id="rename-current-tab">Rename This Tab</button>

  <div class="footer">
    Version 1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
